# Twitter Digest Configuration
# ============================

digest:
  title: "Twitter Morning Digest"
  timezone: "UTC"
  max_tweets_per_handle: 20
  lookback_hours: 24

nitter:
  # List of Nitter instances to try (in order of preference)
  instances:
    - "https://nitter.poast.org"
    - "https://nitter.net"

# Twitter handles to track (without the @ symbol)
handles:
  - "davidbessis"
  - "danwwang"
  - "thorstenball"

# Optional: Custom prompt for Gemini (uncomment to customize)
# gemini_prompt: |
#   Your custom prompt here...
