<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Morning Digest - Sunday, January 11, 2026</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #c9d1d9;
            --accent: #58a6ff;
            --muted: #8b949e;
            --border: #30363d;
            --card-bg: #161b22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        h1 { color: #fff; font-size: 2rem; margin-bottom: 0.5rem; }
        .date { color: var(--muted); font-size: 0.9rem; }
        .handles { color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }
        h2 { color: var(--accent); margin: 2rem 0 1rem; font-size: 1.4rem; }
        h3 { color: #fff; margin: 1.5rem 0 0.75rem; font-size: 1.1rem; }
        p { margin-bottom: 1rem; }
        ul { margin: 0.5rem 0 1rem 1.5rem; }
        li { margin-bottom: 0.5rem; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        code {
            background: var(--card-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }
        hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
        strong { color: #fff; }
        .content { background: var(--card-bg); padding: 1.5rem; border-radius: 8px; }
        nav { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        nav a { margin-right: 1rem; }
        footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.8rem; }
    </style>
</head>
<body>
    <header>
        <h1>Twitter Morning Digest</h1>
        <div class="date">Sunday, January 11, 2026</div>
        <div class="handles">Tracking: @davidbessis, @danwwang, @thorstenball</div>
    </header>
