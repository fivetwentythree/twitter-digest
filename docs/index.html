<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Digest</title>
    <style>
        :root {
            --bg: #0d1117;
            --fg: #c9d1d9;
            --accent: #58a6ff;
            --muted: #8b949e;
            --border: #30363d;
            --card-bg: #161b22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #fff; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: var(--muted); margin-bottom: 2rem; }
        .digest-list { list-style: none; }
        .digest-list li {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
        .digest-list a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .digest-list a:hover { text-decoration: underline; }
        footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>Twitter Digest</h1>
    <p class="subtitle">Daily AI-powered summaries of tweets from people you follow</p>
    <ul class="digest-list">
        <li>No digests yet. Check back after the first scheduled run!</li>
    </ul>
    <footer>
        Powered by GitHub Actions + Gemini 2.5 Flash
    </footer>
</body>
</html>
